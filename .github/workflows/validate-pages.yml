name: 校验站点完整性

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 脚本语法检查
        run: python3 -m py_compile scripts/generate.py scripts/check_pages.py
      - name: 校验归档页精讲完整性 / 首页一致性 / 分类配色
        run: python3 scripts/check_pages.py
